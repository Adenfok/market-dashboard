name: Update market data

# Refreshes the dashboard data and republishes the static site.
on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours (UTC)
  workflow_dispatch: {}         # lets you run it manually from the Actions tab

permissions:
  contents: write               # allow the job to commit the refreshed data

concurrency:                    # never run two updates at once
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data + build site
        run: python generate.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/index.html lastgood.json
          git diff --staged --quiet || git commit -m "data refresh: $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
